[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xstack"
version = "0.2.0"
description = "Design of X-ray multilayer mirrors with manufacturing constraints and fitting of measured reflectivity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "lmfit>=1.3",
    "xraylib>=4.1",
]

[project.scripts]
xstack = "xstack.__main__:main"

[project.gui-scripts]
xstack-design = "xstack.gui.design.app:main"
xstack-fit = "xstack.gui.fit.app:main"

[project.entry-points."xstack.plugins"]
design = "xstack.design.plugin"

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
    "pytest-benchmark>=5",
    "pytest-qt>=4.4",
    "hypothesis>=6",
    "mpmath>=1.3",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xstack"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/xstack"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--benchmark-skip", "--doctest-modules"]
markers = [
    "slow: long-running tests",
    "gui: tests that need a Qt application",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "D", "NPY", "RUF", "SIM", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PT011"]
"src/xstack/core/structure/coatings/*" = ["N803"]
"src/xstack/gui/**" = ["N802", "N815"]

[tool.mypy]
python_version = "3.12"
files = ["src/xstack", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["xstack.gui.*"]
disallow_subclassing_any = false
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["lmfit.*", "xraylib.*", "pyqtgraph.*", "mpmath.*", "scipy.*", "PySide6.*"]
ignore_missing_imports = true
